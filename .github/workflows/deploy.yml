name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-progress rollout before starting another one.
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Verify built Worker rendering
        run: node scripts/test-worker.mjs
      - run: npm run server:build
      - uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: |
            dist/client
            dist/server
            work/multiplayer
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      MULTIPLAYER_DATABASE_URL: ${{ secrets.MULTIPLAYER_DATABASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
      SITE_TEST_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment settings
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEON_API_KEY MULTIPLAYER_DATABASE_URL NEON_AUTH_COOKIE_SECRET SITE_TEST_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key. See docs/deployment.md."
              exit 1
            fi
          done
          node -e 'const u = new URL(process.env.SITE_TEST_URL); if (u.protocol !== "https:" || u.origin !== process.env.SITE_TEST_URL) throw new Error("PRODUCTION_URL must be an HTTPS origin without a trailing slash")'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: deployment
      - name: Apply database schema
        run: node scripts/migrate.mjs
      - name: Deploy multiplayer server
        run: npm run server:deploy
      - name: Deploy website with its runtime secret
        shell: bash
        run: |
          secret_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.argv[1], JSON.stringify({ MULTIPLAYER_DATABASE_URL: process.env.MULTIPLAYER_DATABASE_URL, NEON_AUTH_COOKIE_SECRET: process.env.NEON_AUTH_COOKIE_SECRET }), { mode: 0o600 })' "$secret_file"
          npx wrangler deploy --config dist/server/wrangler.json --secrets-file "$secret_file"
      - name: Wait for website HTTPS to become ready
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 10 "$SITE_TEST_URL/" --output /dev/null
      - name: Verify website and multiplayer together
        run: node scripts/test-site-join.mjs
      - name: Verify accounts and saved settings
        run: node scripts/test-accounts.mjs
